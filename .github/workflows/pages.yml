name: Publicar el explorador en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "explorer/index.html"
      - "explorer/demo/**"
      - "explorer/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Solo la página y el ejemplo: los Parquet por año de explorer/data/ no se versionan.
      - name: Armar el sitio
        run: |
          mkdir -p _site/demo
          cp explorer/index.html _site/
          cp explorer/demo/*.parquet _site/demo/
          cp -r explorer/assets _site/assets
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
